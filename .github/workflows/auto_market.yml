name: Auto Update Market & Gold

on:
  schedule:
    # Quét định kỳ mỗi 15 phút trong phiên giao dịch (9h - 15h, Thứ 2 đến Thứ 6)
    - cron: '*/15 2-8 * * 1-5'
    # Chốt phiên chiều lúc 15h30 (8h30 UTC) và buổi tối lúc 19h00 (12h00 UTC)
    - cron: '30 8 * * 1-5'
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run Crawler
        run: |
          python - << 'EOF'
          import json, re, time, requests
          from datetime import datetime, timezone, timedelta
          from bs4 import BeautifulSoup

          vn_now = datetime.now(timezone(timedelta(hours=7)))
          time_str = vn_now.strftime("%H:%M %d/%m")
          today_dm = vn_now.strftime("%d/%m")
          print(f"=== BẮT ĐẦU CÀO DỮ LIỆU LÚC {time_str} ===")

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Accept": "application/json, text/html, */*"
          }

          # 1. KÉO LỊCH SỬ NẾN VN-INDEX ĐỂ VẼ BIỂU ĐỒ
          dates = ["28/10", "29/10", "30/10", "31/10", "03/11", "04/11", "05/11", "06/11", "07/11", "10/11"]
          prices = [1715.2, 1722.5, 1718.0, 1730.4, 1726.8, 1735.1, 1729.0, 1740.2, 1738.5, 1743.07]
          try:
              to_ts = int(time.time())
              from_ts = to_ts - 35 * 86400
              r_ent = requests.get(
                  f"https://services.entrade.com.vn/chart-api/v2/ohlcs/index?resolution=1D&symbol=VNINDEX&from={from_ts}&to={to_ts}",
                  headers=headers,
                  timeout=5
              )
              if r_ent.status_code == 200:
                  d_ent = r_ent.json()
                  if isinstance(d_ent, dict) and d_ent.get("c") and len(d_ent["c"]) >= 2:
                      prices = [round(float(x), 2) for x in d_ent["c"][-10:]]
                      dates = [datetime.fromtimestamp(ts, timezone(timedelta(hours=7))).strftime("%d/%m") for ts in d_ent["t"][-10:]]
          except Exception as e:
              print(f"[CẢNH BÁO] Lịch sử nến Entrade: {e}")

          # 2. CÀO ĐIỂM SỐ VN-INDEX TRỰC TIẾP (LIVE TICK TRONG PHIÊN)
          vn_val, vn_chg, vn_pct, is_up = 1737.27, -5.8, -0.33, False
          vn_live_ok = False

          # Nguồn 1: Bóc trực tiếp từ thanh CafeF (Chuẩn 100% theo giao diện đang mở)
          try:
              r_cf = requests.get("https://cafef.vn/", headers=headers, timeout=6)
              if r_cf.status_code == 200:
                  m = re.search(r'VNI[:\s]+([\d\.,]+)\s+([+-]?[\d\.,]+)\s+([+-]?[\d\.,]+)%', r_cf.text)
                  if m:
                      vn_val = round(float(m.group(1).replace(",", "")), 2)
                      vn_chg = round(float(m.group(2).replace(",", "")), 2)
                      vn_pct = round(float(m.group(3).replace(",", "")), 2)
                      is_up = vn_chg >= 0
                      vn_live_ok = True
                      print(f"[THÀNH CÔNG] VN-INDEX (CafeF): {vn_val} ({vn_chg:+} điểm, {vn_pct:+0.2f}%)")
          except Exception as e:
              print(f"[LỖI] CafeF live: {e}")

          # Nguồn 2: SSI iBoard nếu CafeF bị trễ
          if not vn_live_ok:
              try:
                  r_ssi = requests.get("https://iboard-query.ssi.com.vn/v2/stock/market-watch?type=index", headers=headers, timeout=5)
                  if r_ssi.status_code == 200:
                      for it in r_ssi.json().get("data", []):
                          if str(it.get("indexId", "")).upper() == "VNINDEX":
                              vn_val = round(float(it.get("indexValue")), 2)
                              vn_chg = round(float(it.get("change")), 2)
                              vn_pct = round(float(it.get("changePercent")), 2)
                              is_up = vn_chg >= 0
                              vn_live_ok = True
                              print(f"[THÀNH CÔNG] VN-INDEX (SSI): {vn_val} ({vn_chg:+} điểm, {vn_pct:+0.2f}%)")
                              break
              except Exception as e:
                  print(f"[LỖI] SSI live: {e}")

          # Cập nhật điểm hiện tại vào đuôi biểu đồ
          if dates[-1] == today_dm:
              prices[-1] = vn_val
          else:
              prices = prices[1:] + [vn_val]
              dates = dates[1:] + [today_dm]

          # 3. CÀO CỔ PHIẾU (BẢNG ĐIỆN VPS ĐÃ CHẠY HOÀN HẢO)
          stocks = {
              "HSG": {"price": 11.0, "pct": "+0.92%", "isUp": True},
              "VND": {"price": 14.6, "pct": "-2.01%", "isUp": False},
              "VCK": {"price": 28.1, "pct": "-1.75%", "isUp": False},
              "SHB": {"price": 11.15, "pct": "+2.29%", "isUp": True}
          }

          try:
              r_stocks = requests.get("https://bgapidatafeed.vps.com.vn/getliststockdata/HSG,VND,VCK,SHB", headers=headers, timeout=6)
              if r_stocks.status_code == 200 and isinstance(r_stocks.json(), list):
                  for item in r_stocks.json():
                      code = item.get("sym")
                      if not code:
                          continue
                      last_price = float(item.get("lastPrice", 0))
                      ref_price = float(item.get("r", 0))
                      price = last_price if last_price > 0 else ref_price
                      if price > 0:
                          diff = round(price - ref_price, 2)
                          pct = round((diff / ref_price) * 100, 2) if ref_price > 0 else 0.0
                          stocks[code] = {
                              "price": round(price, 2),
                              "pct": f"{'+' if pct >= 0 else ''}{pct:.2f}%",
                              "isUp": diff >= 0
                          }
                          print(f"[THÀNH CÔNG] Mã {code}: Giá khớp {price} ({pct:+0.2f}%)")
          except Exception as e:
              print(f"[LỖI] Cào cổ phiếu VPS: {e}")

          # 4. CÀO VÀNG BẢO TÍN MINH CHÂU (ĐÃ CHUẨN 100%)
          gold_buy, gold_sell = "13.55", "13.95"
          try:
              r_gold = requests.get("https://webgia.com/gia-vang/bao-tin-minh-chau/", headers=headers, timeout=7)
              if r_gold.status_code == 200:
                  soup = BeautifulSoup(r_gold.text, "html.parser")
                  for tr in soup.find_all("tr"):
                      txt = tr.get_text().lower()
                      if "nhẫn tròn" in txt or "vàng rồng thăng long" in txt:
                          prices_found = []
                          for td in tr.find_all(["td", "th"]):
                              td_str = td.get_text().strip().lower()
                              if "k" in td_str or "hàm lượng" in td_str:
                                  continue
                              digits = re.sub(r"[^\d]", "", td_str)
                              if len(digits) >= 6 and float(digits) >= 5000000:
                                  prices_found.append(float(digits))
                          if len(prices_found) >= 2:
                              b = prices_found[0] / 1000000
                              s = prices_found[1] / 1000000
                              gold_buy = f"{b:.2f}"
                              gold_sell = f"{s:.2f}"
                              print(f"[THÀNH CÔNG] Vàng BTMC: Mua {gold_buy} - Bán {gold_sell}")
                              break
          except Exception as e:
              print(f"[LỖI] Cào Vàng: {e}")

          # 5. XUẤT FILE MARKET.JSON
          market_output = {
              "updated_at": time_str,
              "time": time_str,
              "vnindex": {
                  "val": f"{vn_val:,.2f}",
                  "raw": vn_val,
                  "change": f"{'+' if vn_chg >= 0 else ''}{vn_chg:.2f}",
                  "pct": f"{'+' if vn_pct >= 0 else ''}{vn_pct:.2f}%",
                  "isUp": is_up,
                  "dates": dates,
                  "prices": prices
              },
              "stocks": stocks,
              "gold": {
                  "name": "Nhẫn tròn trơn Vàng Rồng Thăng Long 999.9",
                  "buy": gold_buy,
                  "sell": gold_sell
              }
          }

          with open("market.json", "w", encoding="utf-8") as f:
              json.dump(market_output, f, ensure_ascii=False, indent=2)

          print("=== ĐÃ GHI FILE MARKET.JSON THÀNH CÔNG ===")
          EOF

      - name: Commit and Push market.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add market.json
          git diff --staged --quiet || (git commit -m "Auto update market data [skip ci]" && git push)
