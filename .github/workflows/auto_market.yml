name: Auto Update Market & Gold

on:
  schedule:
    # Quét định kỳ mỗi 15 phút trong phiên giao dịch (9h - 15h, Thứ 2 đến Thứ 6)
    - cron: '*/15 2-8 * * 1-5'
    # Chốt phiên chiều lúc 15h30 (8h30 UTC) và buổi tối lúc 19h00 (12h00 UTC)
    - cron: '30 8 * * 1-5'
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run Crawler
        run: |
          python - << 'EOF'
          import json, re, time, requests
          from datetime import datetime, timezone, timedelta
          from bs4 import BeautifulSoup

          vn_now = datetime.now(timezone(timedelta(hours=7)))
          time_str = vn_now.strftime("%H:%M %d/%m")
          print(f"=== BẮT ĐẦU CÀO DỮ LIỆU LÚC {time_str} ===")

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Accept": "application/json, text/html, */*"
          }

          # 1. CÀO VN-INDEX & 10 PHIÊN LỊCH SỬ
          vn_val, vn_chg, vn_pct, is_up = 1250.0, 0.0, 0.0, True
          dates = ["28/10", "29/10", "30/10", "31/10", "03/11", "04/11", "05/11", "06/11", "07/11", "11/11"]
          prices = [1252.3, 1256.8, 1261.2, 1258.5, 1264.1, 1260.4, 1268.7, 1265.2, 1263.0, 1250.0]
          vn_ok = False

          # Nguồn 1: Entrade API (bổ sung đầy đủ from/to timestamp để lấy 10 phiên)
          try:
              to_ts = int(time.time())
              from_ts = to_ts - 35 * 86400 # Lùi 35 ngày để đủ ít nhất 10 ngày giao dịch
              r_ent = requests.get(
                  f"https://services.entrade.com.vn/chart-api/v2/ohlcs/index?resolution=1D&symbol=VNINDEX&from={from_ts}&to={to_ts}",
                  headers=headers,
                  timeout=6
              )
              if r_ent.status_code == 200:
                  d_ent = r_ent.json()
                  if isinstance(d_ent, dict) and d_ent.get("c") and len(d_ent["c"]) >= 2:
                      prices = [round(float(x), 2) for x in d_ent["c"][-10:]]
                      dates = [datetime.fromtimestamp(ts, timezone(timedelta(hours=7))).strftime("%d/%m") for ts in d_ent["t"][-10:]]
                      vn_val = prices[-1]
                      vn_chg = round(vn_val - prices[-2], 2)
                      vn_pct = round((vn_chg / prices[-2]) * 100, 2)
                      is_up = vn_chg >= 0
                      vn_ok = True
                      print(f"[THÀNH CÔNG] VN-INDEX (Entrade): {vn_val} ({vn_chg:+} điểm, {vn_pct:+0.2f}%)")
          except Exception as e:
              print(f"[LỖI] VN-INDEX Entrade: {e}")

          # Nguồn 2: SSI iBoard API (Dự phòng nếu Entrade nghẽn)
          if not vn_ok:
              try:
                  r_ssi = requests.get("https://iboard-query.ssi.com.vn/v2/stock/market-watch?type=index", headers=headers, timeout=5)
                  if r_ssi.status_code == 200:
                      for idx_item in r_ssi.json().get("data", []):
                          if idx_item.get("indexId") == "VNINDEX":
                              vn_val = float(idx_item.get("indexValue", vn_val))
                              vn_chg = float(idx_item.get("change", 0))
                              vn_pct = float(idx_item.get("changePercent", 0))
                              is_up = vn_chg >= 0
                              prices[-1] = vn_val
                              vn_ok = True
                              print(f"[THÀNH CÔNG] VN-INDEX (SSI): {vn_val} ({vn_chg:+} điểm, {vn_pct:+0.2f}%)")
                              break
              except Exception as e:
                  print(f"[LỖI] VN-INDEX SSI: {e}")

          # Nguồn 3: Google Finance (Dự phòng cuối cùng)
          if not vn_ok:
              try:
                  r_gf = requests.get("https://www.google.com/finance/quote/INDEXVIE:VNI", headers=headers, timeout=6)
                  if r_gf.status_code == 200:
                      soup = BeautifulSoup(r_gf.text, "html.parser")
                      val_el = soup.select_one("div.YMlKec.fxKbKc")
                      if val_el:
                          clean_num = float(val_el.get_text().replace(",", ""))
                          vn_val = clean_num
                          prices[-1] = vn_val
                          vn_ok = True
                          print(f"[THÀNH CÔNG] VN-INDEX (Google Finance): {vn_val}")
              except Exception as e:
                  print(f"[LỖI] VN-INDEX Google: {e}")

          # 2. CÀO CỔ PHIẾU (ĐÃ CHUẨN 100% QUA BẢNG ĐIỆN VPS)
          stocks = {
              "HSG": {"price": 11.0, "pct": "+0.92%", "isUp": True},
              "VND": {"price": 14.6, "pct": "-2.01%", "isUp": False},
              "VCK": {"price": 28.05, "pct": "-1.92%", "isUp": False},
              "SHB": {"price": 11.15, "pct": "+2.29%", "isUp": True}
          }

          try:
              r_stocks = requests.get("https://bgapidatafeed.vps.com.vn/getliststockdata/HSG,VND,VCK,SHB", headers=headers, timeout=6)
              if r_stocks.status_code == 200 and isinstance(r_stocks.json(), list):
                  for item in r_stocks.json():
                      code = item.get("sym")
                      if not code:
                          continue
                      last_price = float(item.get("lastPrice", 0))
                      ref_price = float(item.get("r", 0))
                      price = last_price if last_price > 0 else ref_price
                      if price > 0:
                          diff = round(price - ref_price, 2)
                          pct = round((diff / ref_price) * 100, 2) if ref_price > 0 else 0.0
                          stocks[code] = {
                              "price": round(price, 2),
                              "pct": f"{'+' if pct >= 0 else ''}{pct:.2f}%",
                              "isUp": diff >= 0
                          }
                          print(f"[THÀNH CÔNG] Mã {code}: Giá khớp {price} ({pct:+0.2f}%)")
          except Exception as e:
              print(f"[LỖI] Cào cổ phiếu VPS: {e}")

          # 3. CÀO VÀNG BẢO TÍN MINH CHÂU (ĐÃ CHUẨN 100%)
          gold_buy, gold_sell = "13.55", "13.95"
          try:
              r_gold = requests.get("https://webgia.com/gia-vang/bao-tin-minh-chau/", headers=headers, timeout=7)
              if r_gold.status_code == 200:
                  soup = BeautifulSoup(r_gold.text, "html.parser")
                  for tr in soup.find_all("tr"):
                      txt = tr.get_text().lower()
                      if "nhẫn tròn" in txt or "vàng rồng thăng long" in txt:
                          prices_found = []
                          for td in tr.find_all(["td", "th"]):
                              td_str = td.get_text().strip().lower()
                              if "k" in td_str or "hàm lượng" in td_str:
                                  continue
                              digits = re.sub(r"[^\d]", "", td_str)
                              if len(digits) >= 6 and float(digits) >= 5000000:
                                  prices_found.append(float(digits))
                          if len(prices_found) >= 2:
                              b = prices_found[0] / 1000000
                              s = prices_found[1] / 1000000
                              gold_buy = f"{b:.2f}"
                              gold_sell = f"{s:.2f}"
                              print(f"[THÀNH CÔNG] Vàng BTMC: Mua {gold_buy} - Bán {gold_sell}")
                              break
          except Exception as e:
              print(f"[LỖI] Cào Vàng: {e}")

          # 4. GHI FILE MARKET.JSON
          market_output = {
              "updated_at": time_str,
              "time": time_str,
              "vnindex": {
                  "val": f"{vn_val:,.2f}",
                  "raw": vn_val,
                  "change": f"{'+' if vn_chg >= 0 else ''}{vn_chg:.2f}",
                  "pct": f"{'+' if vn_pct >= 0 else ''}{vn_pct:.2f}%",
                  "isUp": is_up,
                  "dates": dates,
                  "prices": prices
              },
              "stocks": stocks,
              "gold": {
                  "name": "Nhẫn tròn trơn Vàng Rồng Thăng Long 999.9",
                  "buy": gold_buy,
                  "sell": gold_sell
              }
          }

          with open("market.json", "w", encoding="utf-8") as f:
              json.dump(market_output, f, ensure_ascii=False, indent=2)

          print("=== ĐÃ GHI FILE MARKET.JSON THÀNH CÔNG ===")
          EOF

      - name: Commit and Push market.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add market.json
          git diff --staged --quiet || (git commit -m "Auto update market data [skip ci]" && git push)
