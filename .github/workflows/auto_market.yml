name: Auto Update Market & Gold

on:
  schedule:
    # Quét định kỳ mỗi 15 phút trong phiên giao dịch (9h - 15h, Thứ 2 đến Thứ 6)
    - cron: '*/15 2-8 * * 1-5'
    # Chốt phiên chiều lúc 15h30 (8h30 UTC) và buổi tối lúc 19h00 (12h00 UTC)
    - cron: '30 8 * * 1-5'
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run Crawler
        run: |
          python - << 'EOF'
          import json, re, requests
          from datetime import datetime, timezone, timedelta
          from bs4 import BeautifulSoup

          vn_now = datetime.now(timezone(timedelta(hours=7)))
          time_str = vn_now.strftime("%H:%M %d/%m")
          print(f"=== BẮT ĐẦU CÀO DỮ LIỆU LÚC {time_str} ===")

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Accept": "application/json, text/html, */*"
          }

          # 1. CÀO VN-INDEX (HỖ TRỢ VPS + ENTRADE DỰ PHÒNG)
          vn_val, vn_chg, vn_pct, is_up = 1250.0, 0.0, 0.0, True
          dates = ["28/10", "29/10", "30/10", "31/10", "03/11", "04/11", "05/11", "06/11", "07/11", "11/11"]
          prices = [1252.3, 1256.8, 1261.2, 1258.5, 1264.1, 1260.4, 1268.7, 1265.2, 1263.0, 1250.0]
          vn_ok = False

          # Nguồn 1: Cổng Entrade (Kéo thẳng lịch sử nến ngày để vẽ biểu đồ và điểm hiện tại)
          try:
              r_ent = requests.get("https://services.entrade.com.vn/chart-api/v2/ohlcs/index?resolution=1D&symbol=VNINDEX", headers=headers, timeout=6)
              if r_ent.status_code == 200:
                  d_ent = r_ent.json()
                  c_arr = d_ent.get("c", [])
                  t_arr = d_ent.get("t", [])
                  if len(c_arr) >= 2:
                      prices = [round(float(x), 2) for x in c_arr[-10:]]
                      dates = [datetime.fromtimestamp(ts, timezone(timedelta(hours=7))).strftime("%d/%m") for ts in t_arr[-10:]]
                      vn_val = prices[-1]
                      vn_chg = round(vn_val - prices[-2], 2)
                      vn_pct = round((vn_chg / prices[-2]) * 100, 2)
                      is_up = vn_chg >= 0
                      vn_ok = True
                      print(f"[THÀNH CÔNG] VN-INDEX (Entrade): {vn_val} ({vn_chg:+} điểm, {vn_pct:+0.2f}%)")
          except Exception as e:
              print(f"[LỖI] VN-INDEX Entrade: {e}")

          # Nguồn 2: Bảng điện VPS nếu Entrade bận
          if not vn_ok:
              try:
                  r_vps = requests.get("https://bgapidatafeed.vps.com.vn/getlistindexdetail/VNINDEX", headers=headers, timeout=6)
                  if r_vps.status_code == 200:
                      j = r_vps.json()
                      item = j[0] if (isinstance(j, list) and len(j) > 0 and isinstance(j[0], dict)) else j
                      if isinstance(item, dict) and "cIndex" in item:
                          vn_val = float(item["cIndex"])
                          vn_chg = float(item.get("ot", 0))
                          vn_pct = float(str(item.get("changePc", 0)).replace("%", ""))
                          is_up = vn_chg >= 0
                          prices[-1] = vn_val
                          print(f"[THÀNH CÔNG] VN-INDEX (VPS): {vn_val} ({vn_chg:+} điểm)")
              except Exception as e:
                  print(f"[LỖI] VN-INDEX VPS: {e}")

          # 2. CÀO CỔ PHIẾU QUA BẢNG ĐIỆN VPS (ĐÃ CHẠY TỐT)
          stocks = {
              "HSG": {"price": 10.95, "pct": "+0.46%", "isUp": True},
              "VND": {"price": 14.65, "pct": "-1.68%", "isUp": False},
              "VCK": {"price": 21.30, "pct": "+1.91%", "isUp": True},
              "SHB": {"price": 11.25, "pct": "+3.21%", "isUp": True}
          }

          try:
              r_stocks = requests.get("https://bgapidatafeed.vps.com.vn/getliststockdata/HSG,VND,SHB", headers=headers, timeout=6)
              if r_stocks.status_code == 200:
                  for item in r_stocks.json():
                      code = item.get("sym")
                      last_price = float(item.get("lastPrice", 0))
                      ref_price = float(item.get("r", 0))
                      if last_price > 0 and ref_price > 0:
                          diff = round(last_price - ref_price, 2)
                          pct = round((diff / ref_price) * 100, 2)
                          stocks[code] = {
                              "price": round(last_price, 2),
                              "pct": f"{'+' if pct >= 0 else ''}{pct:.2f}%",
                              "isUp": diff >= 0
                          }
                          print(f"[THÀNH CÔNG] Mã {code}: Giá khớp {last_price} ({pct:+0.2f}%)")
          except Exception as e:
              print(f"[LỖI] Cào cổ phiếu: {e}")

          # 3. CÀO GIÁ VÀNG BẢO TÍN MINH CHÂU (ĐÃ SỬA LỖI ĐỔI CHUỖI SỐ)
          gold_buy, gold_sell = "13.55", "14.05"
          try:
              r_gold = requests.get("https://webgia.com/gia-vang/bao-tin-minh-chau/", headers=headers, timeout=7)
              if r_gold.status_code == 200:
                  soup = BeautifulSoup(r_gold.text, "html.parser")
                  for tr in soup.find_all("tr"):
                      txt = tr.get_text().lower()
                      if "nhẫn tròn" in txt or "vàng rồng thăng long" in txt:
                          # Lấy chỉ ký tự số, loại bỏ hoàn toàn dấu chấm dấu phẩy
                          nums = []
                          for td in tr.find_all(["td", "th"]):
                              digits = re.sub(r"[^\d]", "", td.get_text().strip())
                              if len(digits) >= 5:
                                  nums.append(float(digits))
                          if len(nums) >= 2:
                              b, s = nums[0], nums[1]
                              if b >= 1000000:
                                  b /= 1000000
                                  s /= 1000000
                              elif b >= 10000:
                                  b /= 1000
                                  s /= 1000
                              gold_buy = f"{b:.2f}"
                              gold_sell = f"{s:.2f}"
                              print(f"[THÀNH CÔNG] Vàng BTMC: Mua {gold_buy} - Bán {gold_sell}")
                              break
          except Exception as e:
              print(f"[LỖI] Cào Vàng: {e}")

          # 4. GHI FILE MARKET.JSON
          market_output = {
              "updated_at": time_str,
              "time": time_str,
              "vnindex": {
                  "val": f"{vn_val:,.2f}",
                  "raw": vn_val,
                  "change": f"{'+' if vn_chg >= 0 else ''}{vn_chg:.2f}",
                  "pct": f"{'+' if vn_pct >= 0 else ''}{vn_pct:.2f}%",
                  "isUp": is_up,
                  "dates": dates,
                  "prices": prices
              },
              "stocks": stocks,
              "gold": {
                  "name": "Nhẫn tròn trơn Vàng Rồng Thăng Long 999.9",
                  "buy": gold_buy,
                  "sell": gold_sell
              }
          }

          with open("market.json", "w", encoding="utf-8") as f:
              json.dump(market_output, f, ensure_ascii=False, indent=2)

          print("=== ĐÃ GHI FILE MARKET.JSON THÀNH CÔNG ===")
          EOF

      - name: Commit and Push market.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add market.json
          git diff --staged --quiet || (git commit -m "Auto update market data [skip ci]" && git push)
