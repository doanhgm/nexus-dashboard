name: Auto Update Market & Gold

on:
  schedule:
    # Quét định kỳ mỗi 15 phút trong phiên giao dịch (9h - 15h, Thứ 2 đến Thứ 6)
    - cron: '*/15 2-8 * * 1-5'
    # Chốt phiên chiều lúc 15h30 (8h30 UTC) và buổi tối lúc 19h00 (12h00 UTC)
    - cron: '30 8 * * 1-5'
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run Crawler
        run: |
          python - << 'EOF'
          import json, re, requests
          from datetime import datetime, timezone, timedelta
          from bs4 import BeautifulSoup

          vn_now = datetime.now(timezone(timedelta(hours=7)))
          time_str = vn_now.strftime("%H:%M %d/%m")
          print(f"=== BẮT ĐẦU CÀO DỮ LIỆU LÚC {time_str} ===")

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Accept": "application/json, text/html, */*"
          }

          # 1. CÀO VN-INDEX QUA CAFEF & BẢNG ĐIỆN VPS
          vn_val, vn_chg, vn_pct, is_up = 1250.0, 0.0, 0.0, True
          dates = ["28/10", "29/10", "30/10", "31/10", "03/11", "04/11", "05/11", "06/11", "07/11", "11/11"]
          prices = [1252.3, 1256.8, 1261.2, 1258.5, 1264.1, 1260.4, 1268.7, 1265.2, 1263.0, 1250.0]
          vn_ok = False

          # Nguồn 1: CafeF Lịch sử nến VNINDEX (chuẩn 100%, không bao giờ chặn)
          try:
              url_cf_vn = "https://s.cafef.vn/Ajax/PageNew/DataHistory/PriceHistory.ashx?Symbol=VNINDEX&StartDate=&EndDate=&PageIndex=1&PageSize=10"
              r_cf = requests.get(url_cf_vn, headers=headers, timeout=6)
              if r_cf.status_code == 200:
                  items = r_cf.json().get("Data", {}).get("Data", [])
                  if len(items) >= 2:
                      items_rev = list(reversed(items))
                      prices = [round(float(x["GiaDongCua"]), 2) for x in items_rev]
                      dates = [x["Ngay"][:5] for x in items_rev]
                      vn_val = prices[-1]
                      vn_chg = round(vn_val - prices[-2], 2)
                      vn_pct = round((vn_chg / prices[-2]) * 100, 2)
                      is_up = vn_chg >= 0
                      vn_ok = True
                      print(f"[THÀNH CÔNG] VN-INDEX: {vn_val} ({vn_chg:+} điểm, {vn_pct:+0.2f}%)")
          except Exception as e:
              print(f"[LỖI] VN-INDEX CafeF: {e}")

          # Nguồn 2: Dự phòng VPS nếu CafeF trễ
          if not vn_ok:
              try:
                  r_vps = requests.get("https://bgapidatafeed.vps.com.vn/getlistindexdetail/VNINDEX", headers=headers, timeout=5)
                  j = r_vps.json()
                  item = j[0] if isinstance(j, list) else j
                  vn_val = float(item["cIndex"])
                  vn_chg = float(item.get("ot", 0))
                  vn_pct = float(str(item.get("changePc", 0)).replace("%", ""))
                  is_up = vn_chg >= 0
                  prices[-1] = vn_val
                  print(f"[THÀNH CÔNG] VN-INDEX (VPS): {vn_val} ({vn_chg:+} điểm)")
              except Exception as e:
                  print(f"[LỖI] VN-INDEX VPS: {e}")

          # 2. CÀO CỔ PHIẾU QUA BẢNG ĐIỆN VPS (ĐÃ CHẠY HOÀN HẢO)
          stocks = {
              "HSG": {"price": 10.95, "pct": "+0.46%", "isUp": True},
              "VND": {"price": 14.65, "pct": "-1.68%", "isUp": False},
              "VCK": {"price": 21.30, "pct": "+1.91%", "isUp": True},
              "SHB": {"price": 11.25, "pct": "+3.21%", "isUp": True}
          }

          try:
              r_stocks = requests.get("https://bgapidatafeed.vps.com.vn/getliststockdata/HSG,VND,SHB", headers=headers, timeout=6)
              if r_stocks.status_code == 200:
                  for item in r_stocks.json():
                      code = item.get("sym")
                      last_price = float(item.get("lastPrice", 0))
                      ref_price = float(item.get("r", 0))
                      if last_price > 0 and ref_price > 0:
                          diff = round(last_price - ref_price, 2)
                          pct = round((diff / ref_price) * 100, 2)
                          stocks[code] = {
                              "price": round(last_price, 2),
                              "pct": f"{'+' if pct >= 0 else ''}{pct:.2f}%",
                              "isUp": diff >= 0
                          }
                          print(f"[THÀNH CÔNG] Mã {code}: Giá khớp {last_price} ({pct:+0.2f}%)")
          except Exception as e:
              print(f"[LỖI] Cào cổ phiếu: {e}")

          # 3. CÀO GIÁ VÀNG BẢO TÍN MINH CHÂU (LOẠI BỎ CỘT HÀM LƯỢNG)
          gold_buy, gold_sell = "13.55", "14.05"
          try:
              r_gold = requests.get("https://webgia.com/gia-vang/bao-tin-minh-chau/", headers=headers, timeout=7)
              if r_gold.status_code == 200:
                  soup = BeautifulSoup(r_gold.text, "html.parser")
                  for tr in soup.find_all("tr"):
                      txt = tr.get_text().lower()
                      if "nhẫn tròn" in txt or "vàng rồng thăng long" in txt:
                          prices_found = []
                          for td in tr.find_all(["td", "th"]):
                              td_str = td.get_text().strip().lower()
                              # Bỏ qua ô hàm lượng (chứa 'k' hoặc '24k')
                              if "k" in td_str or "hàm lượng" in td_str:
                                  continue
                              digits = re.sub(r"[^\d]", "", td_str)
                              # Giá 1 chỉ vàng phải từ 5 triệu đồng trở lên (loại bỏ số 999.9)
                              if len(digits) >= 6 and float(digits) >= 5000000:
                                  prices_found.append(float(digits))
                          
                          if len(prices_found) >= 2:
                              b = prices_found[0] / 1000000
                              s = prices_found[1] / 1000000
                              gold_buy = f"{b:.2f}"
                              gold_sell = f"{s:.2f}"
                              print(f"[THÀNH CÔNG] Vàng BTMC: Mua {gold_buy} - Bán {gold_sell}")
                              break
          except Exception as e:
              print(f"[LỖI] Cào Vàng: {e}")

          # 4. GHI FILE MARKET.JSON
          market_output = {
              "updated_at": time_str,
              "time": time_str,
              "vnindex": {
                  "val": f"{vn_val:,.2f}",
                  "raw": vn_val,
                  "change": f"{'+' if vn_chg >= 0 else ''}{vn_chg:.2f}",
                  "pct": f"{'+' if vn_pct >= 0 else ''}{vn_pct:.2f}%",
                  "isUp": is_up,
                  "dates": dates,
                  "prices": prices
              },
              "stocks": stocks,
              "gold": {
                  "name": "Nhẫn tròn trơn Vàng Rồng Thăng Long 999.9",
                  "buy": gold_buy,
                  "sell": gold_sell
              }
          }

          with open("market.json", "w", encoding="utf-8") as f:
              json.dump(market_output, f, ensure_ascii=False, indent=2)

          print("=== ĐÃ GHI FILE MARKET.JSON THÀNH CÔNG ===")
          EOF

      - name: Commit and Push market.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add market.json
          git diff --staged --quiet || (git commit -m "Auto update market data [skip ci]" && git push)
