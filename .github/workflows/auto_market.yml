name: Auto Update Market & Gold

on:
  schedule:
    # Quét định kỳ mỗi 15 phút trong phiên giao dịch (9h - 15h, Thứ 2 đến Thứ 6)
    - cron: '*/15 2-8 * * 1-5'
    # Chốt phiên chiều lúc 15h30 (8h30 UTC) và buổi tối lúc 19h00 (12h00 UTC)
    - cron: '30 8 * * 1-5'
    - cron: '0 12 * * *'
  push:
    paths:
      - 'photos/**' # Tự động quét và cập nhật ngay khi bạn thêm/xóa ảnh trong thư mục photos
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run Crawler
        run: |
          python - << 'EOF'
          import json, re, time, os, requests
          from datetime import datetime, timezone, timedelta
          from bs4 import BeautifulSoup

          vn_now = datetime.now(timezone(timedelta(hours=7)))
          time_str = vn_now.strftime("%H:%M %d/%m")
          today_dm = vn_now.strftime("%d/%m")
          print(f"=== BẮT ĐẦU CÀO DỮ LIỆU LÚC {time_str} ===")

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Accept": "application/json, text/html, */*"
          }

          # 1. KÉO LỊCH SỬ NẾN VN-INDEX 1 NĂM (ENTRADE 1D)
          to_ts = int(time.time())
          from_ts = to_ts - 370 * 86400
          dates = ["11/25", "01/26", "03/26", "05/26", "07/26", "09/26", "11/26"]
          prices = [1250.0, 1280.0, 1320.0, 1450.0, 1580.0, 1690.0, 1740.19]
          ref_price = 1743.07

          try:
              r_ent_d = requests.get(
                  f"https://services.entrade.com.vn/chart-api/v2/ohlcs/index?resolution=1D&symbol=VNINDEX&from={from_ts}&to={to_ts}",
                  headers=headers,
                  timeout=6
              )
              if r_ent_d.status_code == 200:
                  d_ent = r_ent_d.json()
                  if isinstance(d_ent, dict) and d_ent.get("c") and len(d_ent["c"]) >= 10:
                      raw_c = d_ent["c"]
                      raw_t = d_ent["t"]
                      step = max(1, len(raw_c) // 70)
                      sampled = list(range(0, len(raw_c) - 1, step)) + [len(raw_c) - 1]
                      prices = [round(float(raw_c[i]), 2) for i in sampled]
                      dates = [datetime.fromtimestamp(raw_t[i], timezone(timedelta(hours=7))).strftime("%m/%y") for i in sampled]
                      ref_price = float(raw_c[-1])
                      print(f"[THÀNH CÔNG] Đã tải nến VN-INDEX 1 năm ({len(prices)} điểm)")
          except Exception as e:
              print(f"[LỖI] VN-INDEX 1 năm: {e}")

          # 2. CÀO ĐIỂM SỐ VN-INDEX LIVE TRONG PHIÊN
          vn_val, vn_chg, vn_pct, is_up = ref_price, 0.0, 0.0, True
          try:
              from_1m = to_ts - 7200
              r_1m = requests.get(
                  f"https://services.entrade.com.vn/chart-api/v2/ohlcs/index?resolution=1&symbol=VNINDEX&from={from_1m}&to={to_ts}",
                  headers=headers,
                  timeout=5
              )
              if r_1m.status_code == 200:
                  d_1m = r_1m.json()
                  if isinstance(d_1m, dict) and d_1m.get("c") and len(d_1m["c"]) > 0:
                      vn_val = round(float(d_1m["c"][-1]), 2)
                      vn_chg = round(vn_val - ref_price, 2)
                      vn_pct = round((vn_chg / ref_price) * 100, 2)
                      is_up = vn_chg >= 0
                      prices[-1] = vn_val
                      print(f"[THÀNH CÔNG] VN-INDEX Live: {vn_val} ({vn_chg:+} điểm, {vn_pct:+0.2f}%)")
          except Exception as e:
              print(f"[LỖI] VN-INDEX Live: {e}")

          # 3. CÀO 4 MÃ CỔ PHIẾU (VPS)
          stocks = {
              "HSG": {"price": 10.95, "pct": "+0.46%", "isUp": True},
              "VND": {"price": 14.70, "pct": "-1.34%", "isUp": False},
              "VCK": {"price": 28.10, "pct": "-1.75%", "isUp": False},
              "SHB": {"price": 11.15, "pct": "+2.29%", "isUp": True}
          }

          try:
              r_stocks = requests.get("https://bgapidatafeed.vps.com.vn/getliststockdata/HSG,VND,VCK,SHB", headers=headers, timeout=6)
              if r_stocks.status_code == 200 and isinstance(r_stocks.json(), list):
                  for item in r_stocks.json():
                      code = item.get("sym")
                      if not code:
                          continue
                      last_price = float(item.get("lastPrice", 0))
                      ref_p = float(item.get("r", 0))
                      price = last_price if last_price > 0 else ref_p
                      if price > 0:
                          diff = round(price - ref_p, 2)
                          pct = round((diff / ref_p) * 100, 2) if ref_p > 0 else 0.0
                          stocks[code] = {
                              "price": round(price, 2),
                              "pct": f"{'+' if pct >= 0 else ''}{pct:.2f}%",
                              "isUp": diff >= 0
                          }
                          print(f"[THÀNH CÔNG] Mã {code}: Giá khớp {price} ({pct:+0.2f}%)")
          except Exception as e:
              print(f"[LỖI] Cào cổ phiếu: {e}")

          # 4. CÀO GIÁ MUA VÀO / BÁN RA BTMC
          gold_buy, gold_sell = "13.55", "13.95"
          try:
              r_gold = requests.get("https://webgia.com/gia-vang/bao-tin-minh-chau/", headers=headers, timeout=7)
              if r_gold.status_code == 200:
                  soup = BeautifulSoup(r_gold.text, "html.parser")
                  for tr in soup.find_all("tr"):
                      txt = tr.get_text().lower()
                      if "nhẫn tròn" in txt or "vàng rồng thăng long" in txt:
                          prices_found = []
                          for td in tr.find_all(["td", "th"]):
                              td_str = td.get_text().strip().lower()
                              if "k" in td_str or "hàm lượng" in td_str:
                                  continue
                              digits = re.sub(r"[^\d]", "", td_str)
                              if len(digits) >= 6 and float(digits) >= 5000000:
                                  prices_found.append(float(digits))
                          if len(prices_found) >= 2:
                              gold_buy = f"{prices_found[0] / 1000000:.2f}"
                              gold_sell = f"{prices_found[1] / 1000000:.2f}"
                              print(f"[THÀNH CÔNG] Vàng BTMC: Mua {gold_buy} - Bán {gold_sell} tr/chỉ")
                              break
          except Exception as e:
              print(f"[LỖI] Cào Vàng BTMC: {e}")

          # 5. KÉO NẾN 1 NĂM VÀNG THẾ GIỚI XAU/USD (USD/OZ)
          world_prices = [1985.0, 2025.0, 2160.0, 2330.0, 2410.0, 2580.0, 2685.50]
          world_dates = ["11/25", "01/26", "03/26", "05/26", "07/26", "09/26", "11/26"]
          try:
              url_yg = "https://query1.finance.yahoo.com/v8/finance/chart/GC=F?interval=1d&range=1y"
              r_yg = requests.get(url_yg, headers=headers, timeout=6)
              if r_yg.status_code == 200:
                  res = r_yg.json().get("chart", {}).get("result", [])
                  if res:
                      ts_list = res[0].get("timestamp", [])
                      c_list = res[0].get("indicators", {}).get("quote", [{}])[0].get("close", [])
                      valid_pts = [(t, float(c)) for t, c in zip(ts_list, c_list) if c is not None]
                      if len(valid_pts) >= 15:
                          step = max(1, len(valid_pts) // 70)
                          sampled = valid_pts[::step]
                          if valid_pts[-1] not in sampled:
                              sampled.append(valid_pts[-1])
                          world_prices = [round(p, 2) for _, p in sampled]
                          world_dates = [datetime.fromtimestamp(t, timezone(timedelta(hours=7))).strftime("%m/%y") for t, _ in sampled]
                          print(f"[THÀNH CÔNG] Đã tải nến Vàng XAU/USD ({len(world_prices)} điểm)")
          except Exception as e:
              print(f"[LỖI] Vàng XAU/USD: {e}")

          # 6. CÀO GIÁ XĂNG E10
          gas_e10 = "20.890"
          try:
              r_gas = requests.get("https://webgia.com/gia-xang-dau/petrolimex/", headers=headers, timeout=6)
              if r_gas.status_code == 200:
                  soup = BeautifulSoup(r_gas.text, "html.parser")
                  for tr in soup.find_all("tr"):
                      txt = tr.get_text().lower()
                      if "e10" in txt or "e5" in txt or "ron 92" in txt or "ron 95" in txt:
                          for td in tr.find_all(["td", "th"]):
                              digits = re.sub(r"[^\d]", "", td.get_text())
                              if len(digits) >= 5 and float(digits) >= 15000:
                                  gas_e10 = f"{int(digits):,}".replace(",", ".")
                                  break
                          if gas_e10 != "20.890":
                              break
                  print(f"[THÀNH CÔNG] Giá xăng E10: {gas_e10} đ/lít")
          except Exception as e:
              print(f"[LỖI] Cào xăng dầu: {e}")

          # 7. QUÉT TỰ ĐỘNG THƯ MỤC PHOTOS
          photo_dir = "photos"
          scanned_photos = []
          if os.path.exists(photo_dir):
              valid_exts = ('.jpg', '.jpeg', '.png', '.webp', '.gif', '.bmp')
              scanned_photos = [f"{photo_dir}/{f}" for f in sorted(os.listdir(photo_dir)) if f.lower().endswith(valid_exts)]
          if not scanned_photos:
              scanned_photos = ["anh1.jpg", "anh2.jpg", "anh3.jpg", "anh4.jpg", "anh5.jpg", "anh6.jpg"]
          print(f"[THÀNH CÔNG] Đã quét được {len(scanned_photos)} ảnh trong thư mục photos")

          # 8. XUẤT FILE MARKET.JSON
          market_output = {
              "updated_at": time_str,
              "time": time_str,
              "vnindex": {
                  "val": f"{vn_val:,.2f}",
                  "raw": vn_val,
                  "change": f"{'+' if vn_chg >= 0 else ''}{vn_chg:.2f}",
                  "pct": f"{'+' if vn_pct >= 0 else ''}{vn_pct:.2f}%",
                  "isUp": is_up,
                  "dates": dates,
                  "prices": prices
              },
              "stocks": stocks,
              "gold": {
                  "name": "Nhẫn tròn trơn BTMC 999.9",
                  "buy": gold_buy,
                  "sell": gold_sell,
                  "world_dates": world_dates,
                  "world_prices": world_prices
              },
              "gas": {
                  "e10": gas_e10
              },
              "photos": scanned_photos
          }

          with open("market.json", "w", encoding="utf-8") as f:
              json.dump(market_output, f, ensure_ascii=False, indent=2)

          print("=== ĐÃ GHI FILE MARKET.JSON THÀNH CÔNG ===")
          EOF

      - name: Commit and Push market.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add market.json
          git diff --staged --quiet || (git commit -m "Auto update market data [skip ci]" && git push)
