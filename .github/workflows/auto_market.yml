name: Auto Update Market & Gold

on:
  schedule:
    # Quét định kỳ mỗi 15 phút trong phiên giao dịch (9h - 15h, Thứ 2 đến Thứ 6)
    - cron: '*/15 2-8 * * 1-5'
    # Chốt phiên chiều lúc 15h30 (8h30 UTC) và buổi tối lúc 19h00 (12h00 UTC)
    - cron: '30 8 * * 1-5'
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run Crawler
        run: |
          python - << 'EOF'
          import json, re, requests
          from datetime import datetime, timezone, timedelta
          from bs4 import BeautifulSoup

          vn_now = datetime.now(timezone(timedelta(hours=7)))
          time_str = vn_now.strftime("%H:%M %d/%m")
          print(f"=== BẮT ĐẦU CÀO DỮ LIỆU LÚC {time_str} ===")

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Accept": "application/json, text/html, */*"
          }

          # 1. CÀO VN-INDEX THỰC TẾ QUA API BẢNG ĐIỆN VPS
          vn_val, vn_chg, vn_pct, is_up = 1743.07, 8.45, 0.49, True
          dates = ["28/10", "29/10", "30/10", "31/10", "03/11", "04/11", "05/11", "06/11", "07/11", "11/11"]
          prices = [1715.2, 1722.5, 1718.0, 1730.4, 1726.8, 1735.1, 1729.0, 1740.2, 1738.5, 1743.07]

          try:
              r_vps_idx = requests.get("https://bgapidatafeed.vps.com.vn/getlistindexdetail/VNINDEX", headers=headers, timeout=6)
              if r_vps_idx.status_code == 200:
                  d_idx = r_vps_idx.json()[0]
                  vn_val = float(d_idx.get("cIndex", vn_val))
                  vn_chg = float(d_idx.get("ot", vn_chg))
                  vn_pct = float(str(d_idx.get("changePc", vn_pct)).replace("%", ""))
                  is_up = vn_chg >= 0
                  prices[-1] = vn_val
                  print(f"[THÀNH CÔNG] VN-INDEX: {vn_val} (Thay đổi: {vn_chg:+} điểm, {vn_pct:+0.2f}%)")
              else:
                  print(f"[LỖI] VN-INDEX VPS trả về HTTP {r_vps_idx.status_code}")
          except Exception as e:
              print(f"[LỖI] Cào VN-INDEX: {e}")

          # 2. CÀO 4 MÃ CỔ PHIẾU KHỚP LỆNH QUA BẢNG ĐIỆN VPS
          stocks = {
              "HSG": {"price": 20.85, "pct": "-1.42%", "isUp": False},
              "VND": {"price": 14.90, "pct": "-1.32%", "isUp": False},
              "VCK": {"price": 21.30, "pct": "+1.91%", "isUp": True},
              "SHB": {"price": 10.85, "pct": "-0.91%", "isUp": False}
          }

          try:
              r_stocks = requests.get("https://bgapidatafeed.vps.com.vn/getliststockdata/HSG,VND,SHB", headers=headers, timeout=6)
              if r_stocks.status_code == 200:
                  stock_items = r_stocks.json()
                  for item in stock_items:
                      code = item.get("sym")
                      last_price = float(item.get("lastPrice", 0))
                      ref_price = float(item.get("r", 0))
                      if last_price > 0 and ref_price > 0:
                          diff = round(last_price - ref_price, 2)
                          pct = round((diff / ref_price) * 100, 2)
                          stocks[code] = {
                              "price": round(last_price, 2),
                              "pct": f"{'+' if pct >= 0 else ''}{pct:.2f}%",
                              "isUp": diff >= 0
                          }
                          print(f"[THÀNH CÔNG] Mã {code}: Giá khớp {last_price} ({pct:+0.2f}%)")
              else:
                  print(f"[LỖI] Stocks VPS trả về HTTP {r_stocks.status_code}")
          except Exception as e:
              print(f"[LỖI] Cào cổ phiếu: {e}")

          # 3. CÀO GIÁ VÀNG BẢO TÍN MINH CHÂU
          gold_buy, gold_sell = "13.68", "14.08"
          gold_success = False

          # Nguồn 1: Cào trực tiếp từ bảng giá Webgia
          try:
              r_gold = requests.get("https://webgia.com/gia-vang/bao-tin-minh-chau/", headers=headers, timeout=7)
              if r_gold.status_code == 200:
                  soup = BeautifulSoup(r_gold.text, "html.parser")
                  for tr in soup.find_all("tr"):
                      txt = tr.get_text().lower()
                      if "nhẫn tròn" in txt or "vàng rồng thăng long" in txt:
                          nums = [re.sub(r"[^0-9.]", "", td.get_text().strip()) for td in tr.find_all(["td", "th"])]
                          valid = [n for n in nums if len(n) >= 4]
                          if len(valid) >= 2:
                              b, s = float(valid[0]), float(valid[1])
                              gold_buy = f"{b / 1000:.2f}" if b >= 10000 else f"{b:.2f}"
                              gold_sell = f"{s / 1000:.2f}" if s >= 10000 else f"{s:.2f}"
                              gold_success = True
                              print(f"[THÀNH CÔNG] Vàng BTMC (Webgia): Mua {gold_buy} - Bán {gold_sell}")
                              break
          except Exception as e:
              print(f"[LỖI] Vàng Webgia: {e}")

          # Nguồn 2: Dự phòng qua bảng giá BTMC
          if not gold_success:
              try:
                  r_btmc = requests.get("https://btmc.vn/", headers=headers, timeout=7)
                  if r_btmc.status_code == 200:
                      soup = BeautifulSoup(r_btmc.text, "html.parser")
                      for tr in soup.find_all("tr"):
                          txt = tr.get_text().lower()
                          if "nhẫn tròn" in txt or ("bảo tín" in txt and "999.9" in txt):
                              nums = [re.sub(r"[^0-9.]", "", td.get_text().strip()) for td in tr.find_all(["td", "th"])]
                              valid = [n for n in nums if len(n) >= 4]
                              if len(valid) >= 2:
                                  b, s = float(valid[0]), float(valid[1])
                                  gold_buy = f"{b / 1000:.2f}" if b >= 10000 else f"{b:.2f}"
                                  gold_sell = f"{s / 1000:.2f}" if s >= 10000 else f"{s:.2f}"
                                  print(f"[THÀNH CÔNG] Vàng BTMC (Trực tiếp): Mua {gold_buy} - Bán {gold_sell}")
                                  break
              except Exception as e:
                  print(f"[LỖI] Vàng BTMC: {e}")

          # 4. GHI DỮ LIỆU VÀO FILE MARKET.JSON
          market_output = {
              "updated_at": time_str,
              "time": time_str,
              "vnindex": {
                  "val": f"{vn_val:,.2f}",
                  "raw": vn_val,
                  "change": f"{'+' if vn_chg >= 0 else ''}{vn_chg:.2f}",
                  "pct": f"{'+' if vn_pct >= 0 else ''}{vn_pct:.2f}%",
                  "isUp": is_up,
                  "dates": dates,
                  "prices": prices
              },
              "stocks": stocks,
              "gold": {
                  "name": "Nhẫn tròn trơn Vàng Rồng Thăng Long 999.9",
                  "buy": gold_buy,
                  "sell": gold_sell
              }
          }

          with open("market.json", "w", encoding="utf-8") as f:
              json.dump(market_output, f, ensure_ascii=False, indent=2)

          print("=== ĐÃ GHI FILE MARKET.JSON THÀNH CÔNG ===")
          EOF

      - name: Commit and Push market.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add market.json
          git diff --staged --quiet || (git commit -m "Auto update market data [skip ci]" && git push)
