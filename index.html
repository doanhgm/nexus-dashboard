<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0f14">
<title>Nexus 7 Dashboard</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121923;
    --panel2: #0f151e;
    --text: #f5f7fa;
    --muted: #9aa6b2;
    --line: #253041;
    --accent: #7dd3fc;
    --good: #4ade80;
    --warn: #fde68a;
    --danger: #f87171;
  }
  * { box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; margin: 0;
    background: var(--bg); color: var(--text);
    font-family: Arial, Helvetica, sans-serif; overflow: hidden;
  }
  body { padding: 18px; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1.3fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 14px;
    height: 100%;
  }
  .card {
    background: linear-gradient(180deg, var(--panel), var(--panel2));
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 22px;
    min-width: 0;
    overflow: hidden;
  }
  .hero {
    grid-row: 1 / span 2;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .clock { font-size: 84px; line-height: .95; font-weight: 700; letter-spacing: -4px; }
  .seconds { font-size: 28px; color: var(--muted); letter-spacing: 0; }
  .date { font-size: 24px; margin-top: 12px; color: #d7dee8; }
  
  .weather-main {
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px; margin-top: 26px; padding-right: 8px;
  }
  .weather-icon { display: flex; align-items: center; justify-content: center; }
  .weather-icon svg {
    width: 105px; height: 105px;
    filter: drop-shadow(0 6px 16px rgba(0,0,0,0.6));
    margin-right: 6px;
  }
  .temp { font-size: 62px; font-weight: 700; line-height: 1; }
  .weather-desc { font-size: 22px; color: #dce5ef; padding-bottom: 8px; }
  
  .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 18px; }
  .meta div { background: #0b1118; border: 1px solid #202c3a; border-radius: 14px; padding: 12px; }
  .meta b { display: block; font-size: 18px; margin-top: 3px; }
  .label { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .title { font-size: 18px; font-weight: 700; margin-bottom: 14px; }
  
  .forecast { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }
  .day { padding: 10px 6px; background: #0b1118; border: 1px solid #202c3a; border-radius: 14px; text-align: center; }
  .day .dow { font-size: 13px; color: var(--muted); }
  .day .t { font-size: 17px; font-weight: 700; margin-top: 6px; }

  .calendar-wrap {
    height: calc(100% - 34px);
    border-radius: 14px;
    overflow: hidden;
    background: #0b1118;
    border: 1px solid #202c3a;
  }
  iframe {
    border: 0; width: 100%; height: 100%;
    background: transparent;
    filter: invert(1) hue-rotate(180deg) brightness(1.25) contrast(1.4);
    mix-blend-mode: screen;
  }

  .photo-wrap {
    height: 100%; border-radius: 22px; overflow: hidden;
    background: #0b1118; display: flex; align-items: center; justify-content: center;
  }
  .photo-wrap img {
    width: 100%; height: 100%;
    object-fit: cover; object-position: top center;
    border-radius: 22px; opacity: 0;
    transition: opacity 0.8s ease-in-out;
  }

  .stocks-grid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 8px; margin-top: 6px;
  }
  .stock-item {
    background: #0b1118; border: 1px solid #202c3a; border-radius: 12px;
    padding: 8px 4px; text-align: center; display: flex;
    flex-direction: column; gap: 3px;
  }
  .stock-code { font-size: 13px; font-weight: 700; color: #94a3b8; }
  .stock-price { font-size: 18px; font-weight: 700; }
  .stock-chg { font-size: 12px; font-weight: 600; }
  .font-up { color: var(--good); }
  .font-down { color: var(--danger); }
  .footer { font-size: 12px; color: #6f7c89; margin-top: 14px; }

  @media (orientation: portrait) {
    body { overflow: auto; }
    .grid { grid-template-columns: 1fr; grid-template-rows: auto; height: auto; }
    .hero { grid-row: auto; min-height: 620px; }
    .card { min-height: 420px; }
  }
</style>
</head>
<body>
<div class="grid">
  <!-- Cột 1: Hero (Đồng hồ + Thời tiết) -->
  <section class="card hero">
    <div>
      <div class="label">NEXUS 7 DASHBOARD</div>
      <div style="margin-top:18px">
        <span id="clock" class="clock">--:--</span>
        <span id="seconds" class="seconds">--</span>
      </div>
      <div id="date" class="date">Đang tải...</div>

      <div class="weather-main">
        <div style="display:flex;align-items:flex-end;gap:14px;">
          <div id="temp" class="temp">19°</div>
          <div>
            <div id="weatherDesc" class="weather-desc">Trời quang</div>
            <div id="location" style="color:var(--muted)">Hà Nội</div>
          </div>
        </div>
        <div id="weatherIcon" class="weather-icon"></div>
      </div>

      <div class="meta">
        <div><span class="label">Cảm giác</span><b id="feels">18°C</b></div>
        <div><span class="label">Độ ẩm</span><b id="humidity">60%</b></div>
        <div><span class="label">Gió</span><b id="wind">10 km/h</b></div>
        <div><span class="label">Mưa</span><b id="rain">0 mm</b></div>
      </div>

      <div id="forecast" class="forecast"></div>
    </div>
    <div id="weatherNote" class="footer">Thời tiết: Open‑Meteo • Cập nhật tự động</div>
  </section>

  <!-- Cột 2 trên: Google Calendar -->
  <section class="card">
    <div class="title">Lịch</div>
    <div id="calendarWrap" class="calendar-wrap"></div>
  </section>

  <!-- Cột 3 trên: Khung ảnh tràn viền -->
