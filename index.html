<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0f14">
<title>Nexus 7 Dashboard</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121923;
    --panel2: #0f151e;
    --text: #f5f7fa;
    --muted: #9aa6b2;
    --line: #253041;
    --good: #4ade80;
    --gold: #facc15;
    --danger: #f87171;
  }
  * { box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; margin: 0;
    background: var(--bg); color: var(--text);
    font-family: Arial, Helvetica, sans-serif; overflow: hidden;
  }
  body { padding: 14px; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1.38fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 12px;
    height: 100%;
  }
  .card {
    background: linear-gradient(180deg, var(--panel), var(--panel2));
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 16px;
    min-width: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .hero {
    grid-row: 1 / span 2;
    justify-content: space-between;
  }
  .clock { font-size: 80px; line-height: .95; font-weight: 700; letter-spacing: -3px; }
  .seconds { font-size: 26px; color: var(--muted); }
  .date { font-size: 22px; margin-top: 10px; color: #d7dee8; }
  
  .weather-main {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-top: 20px;
  }
  .weather-icon svg { width: 95px; height: 95px; filter: drop-shadow(0 6px 16px rgba(0,0,0,0.6)); }
  .temp { font-size: 58px; font-weight: 700; line-height: 1; }
  .weather-desc { font-size: 20px; color: #dce5ef; padding-bottom: 6px; }
  
  .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  .meta div { background: #0b1118; border: 1px solid #202c3a; border-radius: 12px; padding: 10px; }
  .meta b { display: block; font-size: 16px; margin-top: 2px; }
  .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; }
  .title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  
  .forecast { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 14px; }
  .day { padding: 8px 4px; background: #0b1118; border: 1px solid #202c3a; border-radius: 12px; text-align: center; }
  .day .dow { font-size: 12px; color: var(--muted); }
  .day .t { font-size: 15px; font-weight: 700; margin-top: 4px; }

  .calendar-wrap {
    flex: 1;
    border-radius: 12px;
    overflow: hidden;
    background: #0b1118;
    border: 1px solid #202c3a;
  }
  iframe {
    border: 0; width: 100%; height: 100%;
    filter: invert(1) hue-rotate(180deg) brightness(1.25) contrast(1.4);
    mix-blend-mode: screen;
  }

  .photo-wrap {
    height: 100%; border-radius: 20px; overflow: hidden;
    background: #0b1118; display: flex; align-items: center; justify-content: center;
  }
  .photo-wrap img {
    width: 100%; height: 100%;
    object-fit: cover; object-position: top center;
    border-radius: 20px; opacity: 0;
    transition: opacity 0.8s ease-in-out;
  }

  /* KHUNG BIỂU ĐỒ CHUYÊN NGHIỆP CÓ TRỤC Y VÀ X CHUẨN HTML */
  .chart-box {
    flex: 1;
    width: 100%;
    min-height: 0;
    position: relative;
    margin: 4px 0 6px 0;
  }
  .chart-box svg {
    width: 100%;
    height: 100%;
    display: block;
    position: absolute;
    left: 0; top: 0;
  }
  .y-axis {
    position: absolute;
    top: 0; right: 4px; bottom: 0;
    pointer-events: none;
  }
  .y-tick {
    position: absolute;
    right: 0;
    font-size: 10px;
    font-weight: 700;
    color: #64748b;
    background: rgba(11, 17, 24, 0.85);
    padding: 1px 5px;
    border-radius: 4px;
    transform: translateY(-50%);
    line-height: 1;
  }
  .x-axis {
    position: absolute;
    bottom: 2px; left: 4px; right: 4px;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
  }
  .x-axis span {
    font-size: 11px;
    font-weight: 600;
    color: #64748b;
    line-height: 1;
  }

  .stocks-grid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 6px; margin-top: auto;
  }
  .stock-item {
    background: #0b1118; border: 1px solid #202c3a; border-radius: 10px;
    padding: 6px 3px; text-align: center; display: flex;
    flex-direction: column; gap: 2px;
  }
  .stock-code { font-size: 12px; font-weight: 700; color: #94a3b8; }
  .stock-price { font-size: 16px; font-weight: 700; }
  .stock-chg { font-size: 11px; font-weight: 600; }
  .font-up { color: var(--good); }
  .font-down { color: var(--danger); }
  .footer { font-size: 11px; color: #6f7c89; margin-top: 10px; }

  @media (orientation: portrait) {
    body { overflow: auto; }
    .grid { grid-template-columns: 1fr; grid-template-rows: auto; height: auto; }
    .hero { grid-row: auto; min-height: 600px; }
    .card { min-height: 400px; }
  }
</style>
</head>
<body>
<div class="grid">
  <!-- Cột 1: Hero (Đồng hồ + Thời tiết) -->
  <section class="card hero">
    <div>
      <div class="label">NEXUS 7 DASHBOARD</div>
      <div style="margin-top:14px">
        <span id="clock" class="clock">--:--</span>
        <span id="seconds" class="seconds">--</span>
      </div>
      <div id="date" class="date">Đang tải...</div>

      <div class="weather-main">
        <div style="display:flex;align-items:flex-end;gap:12px;">
          <div id="temp" class="temp">19°</div>
          <div>
            <div id="weatherDesc" class="weather-desc">Trời quang</div>
            <div id="location" style="color:var(--muted)">Hà Nội</div>
          </div>
        </div>
        <div id="weatherIcon" class="weather-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#facc15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4" fill="#facc15"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
        </div>
      </div>

      <div class="meta">
        <div><span class="label">Cảm giác</span><b id="feels">18°C</b></div>
        <div><span class="label">Độ ẩm</span><b id="humidity">60%</b></div>
        <div><span class="label">Gió</span><b id="wind">10 km/h</b></div>
        <div><span class="label">Mưa</span><b id="rain">0 mm</b></div>
      </div>

      <div id="forecast" class="forecast">
        <div class="day"><div class="dow">Hôm nay</div><div class="t">20° / 15°</div></div>
        <div class="day"><div class="dow">T5</div><div class="t">22° / 15°</div></div>
        <div class="day"><div class="dow">T6</div><div class="t">20° / 17°</div></div>
        <div class="day"><div class="dow">T7</div><div class="t">26° / 18°</div></div>
      </div>
    </div>
    <div id="weatherNote" class="footer">Thời tiết: Open‑Meteo • Cập nhật tự động</div>
  </section>

  <!-- Cột 2 trên: Google Calendar -->
  <section class="card">
    <div class="title">Lịch</div>
    <div id="calendarWrap" class="calendar-wrap"></div>
  </section>
